<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>생명의 어록</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#14171d;color:#f3f1eb}
body{padding:12px;display:flex;justify-content:center;align-items:flex-start}
main{width:min(100%,740px);border:1px solid #353941;border-radius:20px;background:linear-gradient(148deg,#22262e,#191c23);padding:21px;box-shadow:0 16px 40px #0002}
header{display:flex;align-items:center;justify-content:center;padding:2px 0 18px}
h1{margin:0;font-size:17px;font-weight:750;letter-spacing:-.4px;color:#e7c893}
.quote{border:1px solid #3d414b;background:#262b34;border-radius:14px;min-height:200px;display:flex;align-items:center;justify-content:center;padding:34px 25px}
blockquote{margin:0;text-align:center;white-space:pre-wrap;overflow-wrap:anywhere;word-break:keep-all;line-height:2.05;font-size:clamp(16px,2.65vw,20px);font-weight:550}
p.message{margin:0;font-size:14px;line-height:1.85;color:#c5c7d0;text-align:center;word-break:keep-all}
button{margin-top:16px;width:100%;border:0;border-radius:12px;padding:16px;color:#2b2116;background:#e1be86;font-size:16px;font-weight:800;font-family:inherit;cursor:pointer}
button:hover:not(:disabled){background:#f5d3a2}button:active:not(:disabled){transform:scale(.995)}
button:disabled{opacity:.6;cursor:not-allowed}
@media(max-width:480px){body{padding:7px}main{padding:13px;border-radius:15px}.quote{padding:25px 15px;min-height:180px}blockquote{font-size:17px;line-height:1.95}}
</style>
</head>
<body>
<main>
  <header><h1>✦ 생명의 어록</h1></header>
  <section class="quote" aria-live="polite" aria-atomic="true" id="display">
    <p class="message">생명의 어록을 불러오는 중입니다.</p>
  </section>
  <button type="button" id="next" disabled>어록 불러오는 중</button>
</main>
<script>
(()=>{
'use strict';
const button=document.getElementById('next');
const display=document.getElementById('display');
let records=[],last=-1;
function rand(n){if(n<=1)return 0;const a=new Uint32Array(1),max=4294967296,limit=Math.floor(max/n)*n;let x;do{crypto.getRandomValues(a);x=a[0]}while(x>=limit);return x%n;}
function showMessage(message){const p=document.createElement('p');p.className='message';p.textContent=message;display.replaceChildren(p);}
function pick(){
 if(!records.length)return;
 const skipLast = last >= 0 && records.length > 1;
 let index = rand(records.length - (skipLast ? 1 : 0));
 if (skipLast && index >= last) index++;
 last = index;
 const block=document.createElement('blockquote');
 block.textContent=records[index];
 display.replaceChildren(block);
 button.textContent=records.length===1?'어록 다시 뽑기':'다른 어록 뽑기';
}
button.addEventListener('click',pick);
fetch('./data/quotes.json',{cache:'no-store'}).then(async res=>{
 if(!res.ok)throw new Error('Data HTTP '+res.status);
 const json=await res.json();
 const data=Array.isArray(json)?json:json.quotes;
 if(!Array.isArray(data))throw new Error('Invalid quote format');
 const seen=new Set();
 records=data.map(item=>typeof item==='string'?item:item&&item.text).filter(s=>typeof s==='string')
   .map(s=>s.trim()).filter(s=>{if(!s||seen.has(s))return false;seen.add(s);return true;});
 if(!records.length){
   showMessage('아직 등록된 어록이 없습니다.\n어록 데이터가 추가되면 이곳에서 무작위로 표시됩니다.');
   button.textContent='등록된 어록 없음';
   return;
 }
 button.disabled=false;
 pick();
}).catch(err=>{
 console.error('Quote loading failed',err);
 showMessage('어록 데이터를 불러오지 못했습니다. 새로고침해 주세요.');
 button.disabled=false;
 button.textContent='새로고침';
 button.removeEventListener('click',pick);
 button.addEventListener('click',()=>location.reload());
});
})();
</script>
</body>
</html>
