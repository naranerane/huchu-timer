<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>생명의 말씀</title>
<style>
:root{font-family:system-ui,-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#14171d;color:#f4f3ef}
body{display:flex;align-items:center;justify-content:center;padding:12px}
.widget{width:min(100%,720px);border:1px solid #373b45;border-radius:20px;background:linear-gradient(145deg,#20242c,#171a20);box-shadow:0 12px 30px #0002;overflow:hidden}
.header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:18px 20px 12px;gap:8px}
.brand{grid-column:2;font-size:15px;font-weight:750;letter-spacing:-.3px;display:flex;align-items:center;gap:9px}
.symbol{font-size:20px;color:#dbb878}
.scope{grid-column:3;justify-self:end;font-size:11px;letter-spacing:.05em;color:#aaa9b1;border:1px solid #484751;border-radius:999px;padding:6px 11px}
.verse-card{margin:0 15px;min-height:170px;border:1px solid #3b3d48;border-radius:14px;background:#242831;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:26px 23px;gap:15px}
.reference{color:#e8c58b;font-weight:750;font-size:15px;letter-spacing:-.25px}
.verse{font-size:clamp(17px,2.8vw,22px);font-weight:550;line-height:1.85;word-break:keep-all;overflow-wrap:break-word;white-space:pre-wrap}
.hint{color:#a8abb5;font-size:14px;line-height:1.6}
.bottom{padding:15px}
.action{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:15px 20px;border:0;border-radius:11px;background:#d7b57c;color:#24201b;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;transition:background .15s,transform .12s}
.action:hover:not(:disabled){background:#f0cd93}
.action:active:not(:disabled){transform:scale(.992)}
.action:disabled{background:#666975;color:#e0e1e5;cursor:wait}
.action svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.foot{height:12px}
@media(max-width:480px){body{padding:6px}.widget{border-radius:15px}.header{grid-template-columns:1fr;justify-items:center;padding:15px 14px 11px}.brand{grid-column:1}.scope{grid-column:1;justify-self:center}.verse-card{margin:0 9px;min-height:193px;padding:22px 15px}.verse{font-size:18px;line-height:1.75}.bottom{padding:10px}.action{padding:14px}}
@media(prefers-reduced-motion:no-preference){.verse-card.loaded{animation:appear .26s ease-out}@keyframes appear{from{opacity:.5;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}}
</style>
</head>
<body>
<main class="widget" aria-label="신약성경 말씀 뽑기">
 <div class="header"><div class="brand"><span class="symbol" aria-hidden="true">✦</span> 생명의 말씀</div><div class="scope">신약 27권 · 개역한글</div></div>
 <section class="verse-card" id="card" aria-live="polite" aria-atomic="true"><div class="reference" id="ref">말씀을 준비하고 있습니다</div><div class="hint" id="verse">신약성경 전체 구절을 불러오는 중입니다.</div></section>
 <div class="bottom"><button type="button" id="pick" class="action" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20L20 4M13 4h7v7M4 4l3 3M4 11l3 3M13 20l3-3"/></svg><span id="btn-label">말씀 불러오는 중</span></button></div>
</main>
<script>
(() => {
 const books=["마태복음","마가복음","누가복음","요한복음","사도행전","로마서","고린도전서","고린도후서","갈라디아서","에베소서","빌립보서","골로새서","데살로니가전서","데살로니가후서","디모데전서","디모데후서","디도서","빌레몬서","히브리서","야고보서","베드로전서","베드로후서","요한1서","요한2서","요한3서","유다서","요한계시록"];
 const card=document.getElementById("card"),ref=document.getElementById("ref"),verse=document.getElementById("verse"),button=document.getElementById("pick"),buttonLabel=document.getElementById("btn-label");
 let verses=[],last=-1;
 function randomBelow(n){if(n<=1)return 0;const max=4294967296,limit=Math.floor(max/n)*n;const x=new Uint32Array(1);let v;do{crypto.getRandomValues(x);v=x[0]}while(v>=limit);return v%n;}
 function draw(){if(!verses.length)return;let n=last===-1?randomBelow(verses.length):randomBelow(verses.length-1);if(last!==-1&&n>=last)n++;last=n;const v=verses[n];ref.textContent=v.book+" "+v.chapter+":"+v.verse;verse.textContent=v.text;verse.className="verse";card.classList.remove("loaded");void card.offsetWidth;card.classList.add("loaded");buttonLabel.textContent="다시 뽑기";}
 button.addEventListener("click",draw);
 async function loadBook(book){const response=await fetch("./data/"+encodeURIComponent(book)+".json");if(!response.ok)throw Error(book+" "+response.status);const obj=await response.json();if(obj.book!==book||!Array.isArray(obj.chapters))throw Error("Invalid "+book);const out=[];for(const ch of obj.chapters){for(const v of ch.verses||[]){const body=typeof v.text==="string"?v.text.trim():"";if(body&&!/^[(（]?\s*없음\s*[)）]?$/.test(body))out.push({book,chapter:ch.chapter,verse:v.verse,text:body})}}if(!out.length)throw Error("Empty "+book);return out}
 Promise.all(books.map(loadBook)).then(parts=>{verses=parts.flat();button.disabled=false;draw()}).catch(error=>{console.error(error);ref.textContent="불러오지 못했습니다";verse.textContent="인터넷 연결을 확인한 뒤 아래 버튼으로 다시 시도해 주세요.";button.disabled=false;buttonLabel.textContent="새로고침";button.replaceWith(button.cloneNode(true));document.getElementById("pick").addEventListener("click",()=>location.reload());});
})();
</script>
</body>
</html>
