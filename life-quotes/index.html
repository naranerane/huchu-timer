<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark"><title>생명의 어록</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#14171d;color:#f3f1eb}
body{padding:12px;display:flex;justify-content:center;align-items:flex-start}
main{width:min(100%,740px);border:1px solid #353941;border-radius:20px;background:linear-gradient(148deg,#22262e,#191c23);padding:21px;box-shadow:0 16px 40px #0002}
header{display:flex;align-items:center;justify-content:center;padding:2px 0 18px}
h1{margin:0;font-size:17px;font-weight:750;letter-spacing:-.4px;color:#e7c893}
.quote{border:1px solid #3d414b;background:#262b34;border-radius:14px;min-height:200px;display:flex;align-items:center;justify-content:center;padding:34px 25px}
blockquote{margin:0;text-align:center;white-space:pre-wrap;overflow-wrap:anywhere;word-break:keep-all;line-height:2.05;font-size:clamp(16px,2.65vw,20px);font-weight:550}
p.message{margin:0;font-size:14px;color:#c5c7d0;text-align:center}
button{margin-top:16px;width:100%;border:0;border-radius:12px;padding:16px;color:#2b2116;background:#e1be86;font-size:16px;font-weight:800;font-family:inherit;cursor:pointer}
button:hover:not(:disabled){background:#f5d3a2}button:active:not(:disabled){transform:scale(.995)}button:disabled{opacity:.6;cursor:wait}
@media(max-width:480px){body{padding:7px}main{padding:13px;border-radius:15px}.quote{padding:25px 15px;min-height:180px}blockquote{font-size:17px;line-height:1.95}}
</style></head><body>
<main><header><h1>✦ 생명의 어록</h1></header>
<section class="quote" aria-live="polite" aria-atomic="true" id="display"><p class="message" id="loading">생명의 어록을 불러오는 중입니다.</p></section>
<button type="button" id="next" disabled>어록 불러오는 중</button></main>
<script>
(()=>{'use strict';
const button=document.getElementById('next'),display=document.getElementById('display');
let records=[],last=-1;
function rand(n){if(n<=1)return 0;const a=new Uint32Array(1),max=4294967296,limit=Math.floor(max/n)*n;let x;do{crypto.getRandomValues(a);x=a[0]}while(x>=limit);return x%n}
function pick(){if(!records.length)return;let i=last<0?rand(records.length):rand(records.length-1);if(last>=0&&i>=last)i++;last=i;const block=document.createElement('blockquote');block.textContent=records[i].text;display.replaceChildren(block);button.textContent='다른 어록 뽑기'}
button.addEventListener('click',pick);
const parts=Array.from({length:10},(_,i)=>'./data/part-'+String(i+1).padStart(2,'0')+'.json');
Promise.all(parts.map(async file=>{const r=await fetch(file,{cache:'no-cache'});if(!r.ok)throw Error('Load '+file);return r.json()}))
.then(chunks=>{const all=chunks.flat();records=all.filter(q=>q&&typeof q.text==='string'&&q.text.trim()&&!/^(?:없음|\(없음\))$/.test(q.text.trim()));if(records.length!==100)throw Error('Expected 100 quotes, got '+records.length);button.disabled=false;pick()})
.catch(err=>{console.error(err);display.textContent='어록을 불러오지 못했습니다. 새로고침해 주세요.';button.disabled=false;button.textContent='새로고침';button.removeEventListener('click',pick);button.addEventListener('click',()=>location.reload())});
})();
</script></body></html>
