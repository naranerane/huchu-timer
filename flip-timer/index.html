
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minimal Flip Timer</title>

<style>
/* =========================
   기본 화면
========================= */
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
}

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #f7f7f5;
  color: #101010;
  font-family: Arial, sans-serif;
  transition: background .35s;
}

.wrapper {
  width: 100%;
  max-width: 560px;
  padding: 28px 18px;
  text-align: center;
}

/* =========================
   원본 스타일 플립 시계
========================= */
.clock {
  width: 100%;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 14px;
}

.clock-unit {
  min-width: 0;
  text-align: center;
}

/* 원본처럼 진한 회색 입체 카드 */
.flip-card {
  position: relative;
  width: 100%;
  aspect-ratio: .92 / 1;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  border-radius: 11px;

  background: linear-gradient(
    to bottom,
    #dedede 0%,
    #d7d7d7 49.4%,
    #c3c3c3 50%,
    #bfbfbf 100%
  );

  box-shadow:
    inset 0 1px 2px rgba(255,255,255,.55),
    inset 0 -1px 2px rgba(0,0,0,.08),
    0 2px 3px rgba(0,0,0,.07);
}

/* 중앙 플립 가로선 */
.flip-card::after {
  content: "";
  position: absolute;
  top: 50%;
  left: 0;
  right: 0;
  height: 2px;
  background: #959595;
  box-shadow: 0 1px 1px rgba(0,0,0,.12);
  z-index: 3;
}

/* 진한 검정, 두꺼운 숫자 */
.number {
  position: relative;
  z-index: 1;
  display: block;

  font-family:
    Impact,
    "Arial Black",
    "Roboto Condensed",
    sans-serif;

  font-size: clamp(62px, 10vw, 112px);
  font-weight: 900;
  line-height: 1;
  letter-spacing: -5px;
  font-variant-numeric: tabular-nums;

  color: #050505;
  -webkit-text-stroke: 1.2px #050505;
  text-shadow: 0 1px 0 rgba(0,0,0,.18);

  transform: scaleX(.9);
  user-select: none;
}

/* 숫자 변경 시 플립 효과 */
.flip-card.flip .number {
  animation: flipNumber .3s ease;
}

@keyframes flipNumber {
  0%, 100% {
    transform: scaleX(.9) scaleY(1);
  }

  50% {
    transform: scaleX(.9) scaleY(.12);
  }
}

/* HOUR / MINUTE / SECOND */
.unit-label {
  margin-top: 13px;
  color: #555;
  font-family: "Courier New", monospace;
  font-size: 13px;
  font-weight: 900;
  letter-spacing: 4px;
}

/* =========================
   타이머 상태 표시
========================= */
.status {
  margin-top: 34px;
  min-height: 22px;
  color: #111;
  font-family: "Courier New", monospace;
  font-size: 16px;
  font-weight: 900;
  letter-spacing: 5px;
}

.progress-line {
  position: relative;
  width: 100%;
  height: 4px;
  margin-top: 15px;
  background: #595959;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  width: 0%;
  background: #111;
  transition: width .1s linear;
}

/* =========================
   빠른 시작 영역
========================= */
.preset-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 28px 0 12px;
  gap: 8px;
}

.preset-title {
  font-family: "Courier New", monospace;
  font-size: 13px;
  font-weight: 900;
  letter-spacing: 2px;
}

.preset-desc {
  color: #777;
  font-size: 11px;
}

/* 1분 / 2분 / 3분 */
.presets {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 9px;
}

/* 1분 30초 / 2분 30초 */
.presets-bottom {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 9px;
  margin-top: 9px;
}

.preset {
  min-width: 0;
  min-height: 65px;
  padding: 10px 5px;
  border: 2px solid #d0d0d0;
  border-radius: 8px;
  background: #ededed;
  color: #111;
  cursor: pointer;
  transition:
    background .15s,
    color .15s,
    border-color .15s,
    transform .1s;
}

.preset strong {
  display: block;
  font-size: 15px;
  font-weight: 900;
}

.preset small {
  display: block;
  margin-top: 5px;
  color: #777;
  font-family: "Courier New", monospace;
  font-size: 11px;
  font-weight: 900;
}

.preset:hover {
  border-color: #333;
}

.preset:active {
  transform: translateY(2px);
}

/* 선택한 시간 강조 */
.preset.active {
  background: #111;
  border-color: #111;
  color: white;
}

.preset.active small {
  color: #ddd;
}

/* =========================
   분 / 초 직접 입력
========================= */
.settings {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
  margin-top: 25px;
}

.settings label {
  color: #666;
  font-family: "Courier New", monospace;
  font-size: 13px;
  font-weight: 900;
  letter-spacing: 2px;
}

.time-input {
  width: 77px;
  height: 47px;
  background: #d5d5d5;
  border: none;
  border-radius: 7px;
  outline: none;
  color: #080808;
  text-align: center;

  font-family: Impact, Arial, sans-serif;
  font-size: 23px;
  font-weight: 900;

  appearance: textfield;
  -moz-appearance: textfield;
}

.time-input::-webkit-inner-spin-button,
.time-input::-webkit-outer-spin-button {
  -webkit-appearance: none;
  margin: 0;
}

.time-input:focus {
  outline: 2px solid #555;
}

.time-input:disabled {
  opacity: .6;
}

/* =========================
   START PAUSE RESUME RESET
========================= */
.buttons {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 11px;
  margin-top: 20px;
}

.btn {
  height: 54px;
  min-width: 0;
  padding: 0 3px;
  border: none;
  border-radius: 7px;
  background: #101010;
  color: #fff;

  font-family: "Courier New", monospace;
  font-size: 14px;
  font-weight: 900;
  letter-spacing: .5px;

  cursor: pointer;
  box-shadow: 0 2px 1px rgba(0,0,0,.15);
  transition: transform .1s, background .15s;
}

.btn:not(:disabled):hover {
  background: #303030;
}

.btn:not(:disabled):active {
  transform: translateY(3px);
  box-shadow: none;
}

.btn:disabled {
  background: #d0d0d0;
  color: #777;
  cursor: not-allowed;
  box-shadow: none;
}

/* =========================
   하단 로고
========================= */
.footer {
  margin-top: 32px;
  color: #888;
  font-family: "Courier New", monospace;
  font-size: 11px;
  font-weight: 900;
  letter-spacing: 5px;
}

/* =========================
   완료 애니메이션
========================= */
body.completed {
  background: #e3eee4;
}

.wrapper.shake {
  animation: shake .45s ease 3;
}

@keyframes shake {
  0%, 100% {
    transform: translateX(0);
  }
  20%, 60% {
    transform: translateX(-4px);
  }
  40%, 80% {
    transform: translateX(4px);
  }
}

/* =========================
   모바일 최적화
========================= */
@media (max-width: 480px) {
  .wrapper {
    padding: 24px 12px;
  }

  .clock {
    gap: 8px;
  }

  .flip-card {
    border-radius: 8px;
  }

  .number {
    font-size: clamp(48px, 14vw, 76px);
    letter-spacing: -3px;
    -webkit-text-stroke: 1px #050505;
  }

  .unit-label {
    font-size: 10px;
    letter-spacing: 2px;
  }

  .preset strong {
    font-size: 13px;
  }

  .preset-desc {
    font-size: 10px;
  }

  .buttons {
    gap: 7px;
  }

  .btn {
    height: 49px;
    font-size: 11px;
    letter-spacing: 0;
  }
}

@media (prefers-reduced-motion: reduce) {
  .flip-card.flip .number,
  .wrapper.shake {
    animation: none;
  }
}
</style>
</head>

<body>

<main class="wrapper" id="wrapper">

  <!-- 원본 플립 시계 -->
  <div class="clock">

    <div class="clock-unit">
      <div class="flip-card" id="hourCard">
        <span class="number" id="hour">00</span>
      </div>
      <div class="unit-label">HOUR</div>
    </div>

    <div class="clock-unit">
      <div class="flip-card" id="minuteCard">
        <span class="number" id="minute">05</span>
      </div>
      <div class="unit-label">MINUTE</div>
    </div>

    <div class="clock-unit">
      <div class="flip-card" id="secondCard">
        <span class="number" id="second">00</span>
      </div>
      <div class="unit-label">SECOND</div>
    </div>

  </div>

  <!-- 상태 -->
  <div class="status" id="status" role="status">
    STANDBY
  </div>

  <!-- 진행률 -->
  <div class="progress-line">
    <div class="progress-fill" id="progress"></div>
  </div>

  <!-- 빠른 시작 제목 -->
  <div class="preset-heading">
    <span class="preset-title">QUICK START</span>
    <span class="preset-desc">터치하면 즉시 시작</span>
  </div>

  <!-- 빠른 시작 1행 -->
  <div class="presets">

    <button class="preset" data-seconds="60">
      <strong>1분</strong>
      <small>01:00</small>
    </button>

    <button class="preset" data-seconds="120">
      <strong>2분</strong>
      <small>02:00</small>
    </button>

    <button class="preset" data-seconds="180">
      <strong>3분</strong>
      <small>03:00</small>
    </button>

  </div>

  <!-- 빠른 시작 2행 -->
  <div class="presets-bottom">

    <button class="preset" data-seconds="90">
      <strong>1분 30초</strong>
      <small>01:30</small>
    </button>

    <button class="preset" data-seconds="150">
      <strong>2분 30초</strong>
      <small>02:30</small>
    </button>

  </div>

  <!-- 분 / 초 설정 -->
  <div class="settings">

    <label for="inputMinute">MIN</label>
    <input
      id="inputMinute"
      class="time-input"
      type="number"
      min="0"
      max="99"
      value="5"
      inputmode="numeric"
    >

    <label for="inputSecond">SEC</label>
    <input
      id="inputSecond"
      class="time-input"
      type="number"
      min="0"
      max="59"
      value="0"
      inputmode="numeric"
    >

  </div>

  <!-- 기본 조작 버튼 -->
  <div class="buttons">

    <button class="btn" id="startBtn">
      START
    </button>

    <button class="btn" id="pauseBtn" disabled>
      PAUSE
    </button>

    <button class="btn" id="resumeBtn" disabled>
      RESUME
    </button>

    <button class="btn" id="resetBtn">
      RESET
    </button>

  </div>

  <div class="footer">SOTTOSYSTEM</div>

</main>

<script>
/* =========================
   요소 연결
========================= */
const $ = id => document.getElementById(id);

const inputMinute = $('inputMinute');
const inputSecond = $('inputSecond');

const statusEl = $('status');
const progressEl = $('progress');
const wrapper = $('wrapper');

const startBtn = $('startBtn');
const pauseBtn = $('pauseBtn');
const resumeBtn = $('resumeBtn');
const resetBtn = $('resetBtn');

const presetButtons = document.querySelectorAll(
  '.preset'
);

/* =========================
   타이머 상태 변수
========================= */
let totalMs = 300000;
let remainingMs = totalMs;
let endTime = 0;
let timerId = null;

let state = 'standby';

/* 두 자리 숫자 */
function pad(n) {
  return String(n).padStart(2, '0');
}

/* =========================
   숫자 플립 애니메이션
========================= */
function changeNumber(id, cardId, value) {
  const element = $(id);
  const text = pad(value);

  if (element.textContent === text) return;

  element.textContent = text;

  const card = $(cardId);

  card.classList.remove('flip');
  void card.offsetWidth;
  card.classList.add('flip');
}

/* =========================
   시계 화면 갱신
========================= */
function updateDisplay() {
  const seconds = Math.ceil(
    Math.max(0, remainingMs) / 1000
  );

  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = seconds % 60;

  changeNumber('hour', 'hourCard', h);
  changeNumber('minute', 'minuteCard', m);
  changeNumber('second', 'secondCard', s);

  const percent = totalMs > 0
    ? (1 - remainingMs / totalMs) * 100
    : 0;

  progressEl.style.width =
    Math.max(0, Math.min(100, percent)) + '%';
}

/* =========================
   버튼 상태 변경
========================= */
function updateButtons() {
  startBtn.disabled = state === 'running';
  pauseBtn.disabled = state !== 'running';
  resumeBtn.disabled = state !== 'paused';

  const locked =
    state === 'running' || state === 'paused';

  inputMinute.disabled = locked;
  inputSecond.disabled = locked;
}

/* =========================
   빠른 시작 선택 강조
========================= */
function selectPreset(seconds) {
  presetButtons.forEach(button => {
    const selected =
      Number(button.dataset.seconds) === seconds;

    button.classList.toggle('active', selected);
    button.setAttribute(
      'aria-pressed',
      String(selected)
    );
  });
}

/* =========================
   직접 입력값 검증
========================= */
function getInputMs() {
  const m = Number(inputMinute.value);
  const s = Number(inputSecond.value);

  if (
    inputMinute.value.trim() === '' ||
    inputSecond.value.trim() === '' ||
    !Number.isInteger(m) ||
    !Number.isInteger(s) ||
    m < 0 ||
    m > 99 ||
    s < 0 ||
    s > 59
  ) {
    statusEl.textContent = 'INVALID TIME';
    return null;
  }

  const ms = (m * 60 + s) * 1000;

  if (ms <= 0) {
    statusEl.textContent = 'SET TIME';
    return null;
  }

  return ms;
}

/* =========================
   입력 시간 미리보기
========================= */
function previewInput() {
  if (
    state === 'running' ||
    state === 'paused'
  ) return;

  selectPreset(-1);

  const ms = getInputMs();

  if (ms === null) return;

  totalMs = ms;
  remainingMs = ms;

  state = 'standby';

  document.body.classList.remove('completed');
  wrapper.classList.remove('shake');

  statusEl.textContent = 'STANDBY';

  updateDisplay();
  updateButtons();
}

/* =========================
   카운트다운
   실제 종료시각 기준 계산
========================= */
function tick() {
  remainingMs = Math.max(
    0,
    endTime - Date.now()
  );

  updateDisplay();

  if (remainingMs === 0) {
    completeTimer();
  }
}

/* =========================
   카운트다운 시작 공통 함수
========================= */
function beginCountdown(ms) {
  if (!Number.isFinite(ms) || ms <= 0) {
    return;
  }

  clearInterval(timerId);

  totalMs = ms;
  remainingMs = ms;
  endTime = Date.now() + ms;

  state = 'running';

  document.body.classList.remove('completed');
  wrapper.classList.remove('shake');

  statusEl.textContent = 'COUNTDOWN';

  updateDisplay();
  updateButtons();

  timerId = setInterval(tick, 100);
}

/* =========================
   START
========================= */
function startTimer() {
  const ms = getInputMs();

  if (ms === null) return;

  beginCountdown(ms);
}

/* =========================
   QUICK START
   누르면 즉시 시작
========================= */
function quickStart(seconds) {
  inputMinute.value = Math.floor(seconds / 60);
  inputSecond.value = seconds % 60;

  selectPreset(seconds);
  beginCountdown(seconds * 1000);
}

/* =========================
   PAUSE
========================= */
function pauseTimer() {
  if (state !== 'running') return;

  remainingMs = Math.max(
    0,
    endTime - Date.now()
  );

  clearInterval(timerId);
  timerId = null;

  if (remainingMs === 0) {
    completeTimer();
    return;
  }

  state = 'paused';
  statusEl.textContent = 'PAUSED';

  updateDisplay();
  updateButtons();
}

/* =========================
   RESUME
========================= */
function resumeTimer() {
  if (state !== 'paused') return;

  endTime = Date.now() + remainingMs;
  state = 'running';

  statusEl.textContent = 'COUNTDOWN';

  clearInterval(timerId);
  timerId = setInterval(tick, 100);

  updateButtons();
}

/* =========================
   RESET
========================= */
function resetTimer() {
  clearInterval(timerId);
  timerId = null;

  state = 'standby';

  document.body.classList.remove('completed');
  wrapper.classList.remove('shake');

  const ms = getInputMs();

  totalMs = ms ?? 0;
  remainingMs = totalMs;

  statusEl.textContent = 'STANDBY';

  updateDisplay();
  updateButtons();
}

/* =========================
   완료 처리
========================= */
function completeTimer() {
  clearInterval(timerId);
  timerId = null;

  remainingMs = 0;
  state = 'completed';

  updateDisplay();

  statusEl.textContent = '완료!';

  document.body.classList.add('completed');

  wrapper.classList.remove('shake');
  void wrapper.offsetWidth;
  wrapper.classList.add('shake');

  updateButtons();
}

/* =========================
   기본 버튼 이벤트
========================= */
startBtn.addEventListener('click', startTimer);
pauseBtn.addEventListener('click', pauseTimer);
resumeBtn.addEventListener('click', resumeTimer);
resetBtn.addEventListener('click', resetTimer);

/* 빠른 시작 5개 연결 */
presetButtons.forEach(button => {
  button.addEventListener('click', () => {
    const seconds = Number(
      button.dataset.seconds
    );

    quickStart(seconds);
  });
});

/* 직접 시간 설정 */
inputMinute.addEventListener('input', previewInput);
inputSecond.addEventListener('input', previewInput);

/* 엔터키 시작 */
[inputMinute, inputSecond].forEach(input => {
  input.addEventListener('keydown', event => {
    if (event.key === 'Enter') {
      startTimer();
    }
  });
});

/* 브라우저 탭 복귀 시 시간 동기화 */
document.addEventListener(
  'visibilitychange',
  () => {
    if (
      !document.hidden &&
      state === 'running'
    ) {
      tick();
    }
  }
);

/* 초기 실행 */
updateDisplay();
updateButtons();
selectPreset(-1);
</script>

</body>
</html>
